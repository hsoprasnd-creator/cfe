name: Build iOS Dylib
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Compiler Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm lld curl tar xz-utils libtinfo5

      - name: Setup SDK and Dependencies
        run: |
          chmod +x ./get_imgui.sh
          ./get_imgui.sh
          mkdir -p sdk
          curl -L -o iPhoneOS.sdk.tar.xz https://github.com/theos/sdks/releases/download/master/iPhoneOS16.5.sdk.tar.xz
          tar -xf iPhoneOS.sdk.tar.xz -C sdk --strip-components=1

      - name: Compile Dylib
        run: |
          mkdir -p output
          clang++ -target arm64-apple-ios15.0 \
            -isysroot ./sdk \
            -shared -std=c++17 -fobjc-arc -O2 \
            -framework UIKit -framework Foundation -framework CoreGraphics -framework Metal -framework MetalKit -framework QuartzCore \
            -Wl,-headerpad_max_install_names \
            -install_name @executable_path/Frameworks/ImGuiOverlay.dylib \
            -o output/ImGuiOverlay.dylib \
            main.mm \
            ImGuiOverlay.mm \
            imgui.cpp \
            imgui_draw.cpp \
            imgui_tables.cpp \
            imgui_widgets.cpp \
            imgui_impl_metal.mm \
            ESPManager.mm

      - name: Upload Dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImGuiOverlay-dylib
          path: output/ImGuiOverlay.dylib
